name: Workbench checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: TypeScript, SQLite, Git and SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Full coverage remains gating. Windows execution journeys have dedicated
    # shards below: one journey invokes thousands of real guarded Git commands,
    # and the combined serial file exceeded this limit in run 26.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run every portable and connected test on Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm test
      - name: Run Windows tests outside the dedicated execution shards
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $testPaths = @(Get-ChildItem -LiteralPath tests -Filter '*.test.ts' -File | Where-Object { $_.Name -notlike 'production-execution*.test.ts' } | ForEach-Object FullName)
          if ($testPaths.Count -eq 0) { throw 'No Windows portable tests were selected.' }
          node --test @testPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build
      - name: Record actual environment, without secrets
        if: always()
        shell: bash
        run: node scripts/diagnostics.mjs > runtime-observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-observation-${{ matrix.os }}
          path: runtime-observation.json
          retention-days: 14
  execution-windows:
    name: Windows implement-spec integration (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run one bounded shard with all Host guards intact
        shell: pwsh
        env:
          PI_KANBAN_EXECUTION_TRACE: artifacts/production-execution-trace.jsonl
        run: |
          $testPaths = @(Get-ChildItem -LiteralPath tests -Filter 'production-execution*.test.ts' -File | Sort-Object Name | ForEach-Object FullName)
          if ($testPaths.Count -ne 4) { throw 'Expected four execution integration files; update the complete shard partition explicitly.' }
          node --test --test-shard=${{ matrix.shard }}/4 @testPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-implement-spec-shard-${{ matrix.shard }}
          path: artifacts/production-execution-trace.jsonl
          retention-days: 14
  native-windows:
    name: Windows Node-native tools / revised LPAC v2 (required partial evidence)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the exact bundled Pi Worker
        id: bundle
        run: npm run build
      - name: Configure native candidate
        run: cmake -S native/windows -B build/native -A x64
      - name: Compile native candidate
        id: native-build
        run: cmake --build build/native --config Release
      - name: Run revised-v2 Win32 smoke and bounded disk accounting
        run: ctest --test-dir build/native -C Release --output-on-failure --no-tests=error -R '^(native_registry_read_smoke|native_disk_accounting)$'
      - name: Exercise Node-native tools with no configured shell
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.native-build.outcome == 'success' }}
        run: node native/windows/probe-worker.mjs --helper build/native/Release/pi_kanban_native_helper.exe --worker dist/worker/main.mjs --policy lpac-registry-read-no-network-v2 --output artifacts/windows-node-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-node-native-partial-evidence
          path: |
            build/native/Testing/Temporary/LastTest.log
            artifacts/windows-node-native/
          retention-days: 14
  native-windows-diagnostics:
    name: NON-GATING Windows diagnostic / ${{ matrix.diagnostic }}
    runs-on: windows-latest
    # Unsupported candidates remain failed diagnostics, independent of the
    # required Node-only scope. Keep actual step failures and exit-code artifacts.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        diagnostic: [legacy-strict-lpac, ordinary-appcontainer-v3, stock-git-bash-v2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the exact bundled Pi Worker
        run: npm run build
      - name: Configure native diagnostic
        run: cmake -S native/windows -B build/native -A x64
      - name: Compile native diagnostic
        run: cmake --build build/native --config Release
      - name: Run unsupported or unselected candidate and preserve its real outcome
        id: diagnostic
        shell: pwsh
        env:
          DIAGNOSTIC: ${{ matrix.diagnostic }}
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-diagnostic | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          switch ($env:DIAGNOSTIC) {
            'legacy-strict-lpac' {
              ctest --test-dir build/native -C Release --output-on-failure --no-tests=error -R '^native_candidate_smoke$' 2>&1 | Tee-Object artifacts/windows-diagnostic/process.log
            }
            'ordinary-appcontainer-v3' {
              ctest --test-dir build/native -C Release --output-on-failure --no-tests=error -R '^native_appcontainer_smoke$' 2>&1 | Tee-Object artifacts/windows-diagnostic/process.log
            }
            'stock-git-bash-v2' {
              node native/windows/probe-worker.mjs --helper build/native/Release/pi_kanban_native_helper.exe --worker dist/worker/main.mjs --policy lpac-registry-read-no-network-v2 --git-bash "C:\Program Files\Git" --output artifacts/windows-diagnostic/worker 2>&1 | Tee-Object artifacts/windows-diagnostic/process.log
            }
            default { throw "Unknown diagnostic: $env:DIAGNOSTIC" }
          }
          $diagnosticExitCode = $LASTEXITCODE
          @{ diagnostic = $env:DIAGNOSTIC; exitCode = $diagnosticExitCode; gating = $false; releaseAuthorized = $false } | ConvertTo-Json | Set-Content artifacts/windows-diagnostic/outcome.json
          exit $diagnosticExitCode
      - name: Publish the diagnostic outcome visibly
        if: always()
        shell: pwsh
        env:
          DIAGNOSTIC: ${{ matrix.diagnostic }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          $diagnosticCode = if (Test-Path artifacts/windows-diagnostic/outcome.json) { (Get-Content artifacts/windows-diagnostic/outcome.json | ConvertFrom-Json).exitCode } else { 'not recorded; inspect setup/build steps' }
          "Non-gating diagnostic: $env:DIAGNOSTIC; step outcome: $env:DIAGNOSTIC_OUTCOME; original exit code: $diagnosticCode. Available raw output is retained in the artifact. This does not authorize a Windows 11 release or shell support." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:DIAGNOSTIC_OUTCOME -eq 'failure') { Write-Output "::warning::Non-gating $env:DIAGNOSTIC failed. Inspect its original failure and retained raw evidence; this is not a compatibility pass." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostic-${{ matrix.diagnostic }}
          path: |
            build/native/Testing/Temporary/LastTest.log
            artifacts/windows-diagnostic/
          retention-days: 14
  browser:
    name: Synthetic renderer interaction and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-renderer-evidence
          path: |
            artifacts/playwright/
            artifacts/playwright-report/
          retention-days: 14
